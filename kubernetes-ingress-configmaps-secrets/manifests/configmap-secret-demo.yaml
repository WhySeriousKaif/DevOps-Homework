# 1. ConfigMap: Non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  MAX_CONNECTIONS: "100"
---
# 2. Secret: Sensitive credentials (Base64 encoded)
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  # "admin" in Base64: YWRtaW4=
  DB_USER: YWRtaW4=
  # "SuperSecretPassword123!" in Base64: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
  DB_PASS: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
---
# 3. Demo Pod consuming both ConfigMap and Secret
apiVersion: v1
kind: Pod
metadata:
  name: config-secret-demo-pod
  labels:
    app: config-secret-demo
spec:
  containers:
  - name: app
    image: alpine:latest
    command: ["sleep", "3600"]
    env:
    - name: ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: APP_ENV
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASS

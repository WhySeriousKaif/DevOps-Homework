# Pod Lifecycle States Demonstration
apiVersion: v1
kind: Pod
metadata:
  name: pod-running
  labels:
    app: demo-running
spec:
  containers:
  - name: web
    image: nginx:alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-crashloop
  labels:
    app: demo-crashloop
spec:
  containers:
  - name: failer
    image: alpine:latest
    command: ["sh", "-c", "echo 'Failing container initialization...' && exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-imagepullerror
  labels:
    app: demo-imagepull
spec:
  containers:
  - name: broken-image
    image: nginx:non-existent-tag-12345
